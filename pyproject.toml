[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tgline"
version = "0.2.0"
description = "Let your AI agent read your Telegram: CLI on your real account with JSON output and read-only mode. Linux & macOS."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["telethon>=1.36"]
keywords = ["telegram", "cli", "terminal", "telegram-cli", "mtproto"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Chat",
]

[project.urls]
Homepage = "https://github.com/Fogerqwak/tgline"

[project.scripts]
tgline = "tgline:main"

[tool.setuptools]
py-modules = ["tgline"]
